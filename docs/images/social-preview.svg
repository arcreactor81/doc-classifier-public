  <text x="440" y="268" font-size="84" font-weight="700" fill="#1f2328">Doc Classifier</text>
  <text x="444" y="332" font-size="36" font-weight="600" fill="#4c7fe0">Two AI judges, one rule in code.</text>
  <text x="444" y="388" font-size="27" fill="#57606a">Sorts a folder of documents into categories you define.</text>
  <text x="444" y="426" font-size="27" fill="#57606a">Your files stay on your computer; only their text goes out.</text>
