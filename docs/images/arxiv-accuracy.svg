<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 600" width="1180" height="600" role="img" aria-labelledby="title desc" color="#6e7681" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="title">The research-paper stress test: 1,797 papers, two judges, one rule</title>
  <desc id="desc">Top: what happened to 1,797 long research papers in eight subject classes. 983 were filed in the right folder, 23 were filed in the wrong one, 351 were sent to a person and 440 could not be processed, most of them because they were too long for the certainty judge. Bottom: the share of wrong answers among the papers each approach would file, on the 1,357 papers both judges answered. The Claude reader alone, filing every paper, was not exactly right on 187 of 1,357, 13.8 percent. Jev alone, filing only when its certainty was at least 0.90, was wrong on 40 of 1,078, 3.7 percent. The rule the product uses, both judges agreeing and Jev's certainty at least 0.90, was wrong on 23 of 1,006, 2.29 percent, with a 95 percent range of 1.45 to 3.41 percent.</desc>
  <defs>
    <style>
      .h { font-size: 15px; font-weight: 600; fill: currentColor; }
      .k { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; fill: currentColor; }
      .t { font-size: 13px; fill: currentColor; }
      .s { font-size: 12px; fill: currentColor; }
      .n { font-size: 13px; font-weight: 600; fill: currentColor; }
      .right { fill: #4c7fe0; }
      .wrong { fill: #e0664c; }
      .review { fill: currentColor; fill-opacity: 0.28; }
      .cnp { fill: currentColor; }
      .track { fill: currentColor; fill-opacity: 0.06; }
      .axis { stroke: currentColor; stroke-width: 1; stroke-opacity: 0.5; }
      .grid { stroke: currentColor; stroke-width: 1; stroke-opacity: 0.18; stroke-dasharray: 3 4; }
      .whisker { stroke: currentColor; stroke-width: 2; }
      .accent { font-size: 13px; font-weight: 600; fill: #4c7fe0; }
    </style>
  </defs>

  <!-- Panel A: outcomes; x = 60 + 1060 px x share of 1,797 -->
  <text class="k" x="60" y="40">WHAT HAPPENED TO 1,797 LONG RESEARCH PAPERS</text>
  <rect class="right" x="60" y="58" width="579.8" height="44"/>
  <rect class="wrong" x="639.8" y="58" width="13.6" height="44"/>
  <rect class="review" x="653.4" y="58" width="207.0" height="44"/>
  <rect class="cnp" x="860.5" y="58" width="259.5" height="44"/>
  <text x="80" y="86" font-size="15" font-weight="600" fill="#ffffff">983 filed in the right folder (54.7%)</text>

  <line class="axis" x1="990.2" y1="102" x2="990.2" y2="132"/>
  <text class="n" x="1120" y="146" text-anchor="end">440 could not be processed (24.5%)</text>
  <line class="axis" x1="756.9" y1="102" x2="756.9" y2="168"/>
  <text class="n" x="762" y="182">351 sent to a person (19.5%)</text>
  <line class="axis" x1="646.6" y1="102" x2="646.6" y2="204"/>
  <text class="n" x="652" y="218">23 filed in the wrong folder (1.3% of all; 2.29% of those filed)</text>
  <text class="s" x="60" y="146">Filed automatically: 1,006 (56.0%)</text>
  <text class="s" x="60" y="166">Reader: Claude Sonnet 5.5 · certainty judge: Jev 1.13.0 · threshold 0.90</text>
  <text class="s" x="60" y="186">Real site, 12 October 2026 · about USD 0.055 per paper</text>

  <!-- Panel B: wrong among filed, per approach -->
  <text class="k" x="60" y="268">WRONG ANSWERS AMONG THE PAPERS EACH APPROACH WOULD FILE</text>
  <text class="s" x="60" y="288">The 1,357 papers both judges answered, same answers; only the filing rule changes.</text>

  <!-- axis: x = 360 + 48 px per percentage point -->
  <line class="grid" x1="456" y1="300" x2="456" y2="520"/>
  <line class="grid" x1="552" y1="300" x2="552" y2="520"/>
  <line class="grid" x1="648" y1="300" x2="648" y2="520"/>
  <line class="grid" x1="744" y1="300" x2="744" y2="520"/>
  <line class="grid" x1="840" y1="300" x2="840" y2="520"/>
  <line class="grid" x1="936" y1="300" x2="936" y2="520"/>
  <line class="grid" x1="1032" y1="300" x2="1032" y2="520"/>
  <line class="axis" x1="360" y1="300" x2="360" y2="520"/>
  <line class="axis" x1="360" y1="520" x2="1080" y2="520"/>
  <text class="s" x="360" y="540" text-anchor="middle">0%</text>
  <text class="s" x="456" y="540" text-anchor="middle">2%</text>
  <text class="s" x="552" y="540" text-anchor="middle">4%</text>
  <text class="s" x="648" y="540" text-anchor="middle">6%</text>
  <text class="s" x="744" y="540" text-anchor="middle">8%</text>
  <text class="s" x="840" y="540" text-anchor="middle">10%</text>
  <text class="s" x="936" y="540" text-anchor="middle">12%</text>
  <text class="s" x="1032" y="540" text-anchor="middle">14%</text>

  <!-- reader alone: 187 of 1,357 = 13.78% -->
  <text class="t" x="60" y="331">Reader alone</text>
  <text class="s" x="60" y="349">files every paper</text>
  <rect class="track" x="360" y="314" width="720" height="40"/>
  <rect class="wrong" x="360" y="314" width="661.5" height="40"/>
  <text x="1010" y="339" text-anchor="end" font-size="13" font-weight="600" fill="#ffffff">13.8% (187 of 1,357)</text>

  <!-- Jev alone at >= 0.90: 40 of 1,078 = 3.71% -->
  <text class="t" x="60" y="401">Jev alone</text>
  <text class="s" x="60" y="419">files when certainty ≥ 0.90</text>
  <rect class="track" x="360" y="384" width="720" height="40"/>
  <rect class="wrong" x="360" y="384" width="178.1" height="40"/>
  <text class="n" x="546" y="409">3.7% (40 of 1,078)</text>

  <!-- both + threshold: 23 of 1,006 = 2.29%, 95% range 1.45%-3.41% -->
  <text class="accent" x="60" y="471">Both judges agree</text>
  <text class="s" x="60" y="489">and certainty ≥ 0.90 (the product's rule)</text>
  <rect class="track" x="360" y="454" width="720" height="40"/>
  <rect class="wrong" x="360" y="454" width="109.7" height="40"/>
  <line class="whisker" x1="429.8" y1="474" x2="523.7" y2="474"/>
  <line class="whisker" x1="429.8" y1="464" x2="429.8" y2="484"/>
  <line class="whisker" x1="523.7" y1="464" x2="523.7" y2="484"/>
  <text class="n" x="534" y="479">2.29% (23 of 1,006) · 95% range 1.45%–3.41%</text>

  <text class="s" x="60" y="580">The reader's 187 include answers that named no category or two; the product never files those. Labels are each paper's arXiv primary category.</text>
</svg>
